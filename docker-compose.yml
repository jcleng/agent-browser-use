services:
  agent-browser-use:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: agent-browser-use
    container_name: agent-browser-use
    init: true
    shm_size: "1gb"
    # Left side is the host address. 0.0.0.0 listens on every network interface;
    # use 127.0.0.1:3000:3000 to keep it on this machine only.
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - agent-browser-use-data:/data
    environment:
      # Anything in this container is reachable from the LAN once the port is
      # published, so set a password before exposing it.
      AGENT_BROWSER_USE_PASSWORD: "${AGENT_BROWSER_USE_PASSWORD:-}"
      # Browser extensions are off unless this is true. Unpacked extensions
      # (folders with manifest.json) go in /data/extensions on the volume.
      AGENT_BROWSER_USE_EXTENSIONS: "${AGENT_BROWSER_USE_EXTENSIONS:-false}"
      AGENT_BROWSER_USE_EXTENSIONS_DIR: "/data/extensions"
    restart: unless-stopped

volumes:
  agent-browser-use-data:
